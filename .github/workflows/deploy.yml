# 自动部署到 GitHub Pages
# 用户首次启用：仓库 Settings → Pages → Source: GitHub Actions
# 之后每次 push 到 main 都会自动重新部署
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一次部署，新的 push 会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 项目本身就是纯静态站（HTML/CSS/JS），不需要 build。
      # 直接把整个仓库根目录作为 artifact 上传即可。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
